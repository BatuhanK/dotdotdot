name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version from package.json's "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Worker types are up to date with wrangler.jsonc
        run: pnpm cf-typegen --check
      - run: pnpm format:check
      - run: pnpm lint
      - name: Typecheck and build
        run: pnpm build
